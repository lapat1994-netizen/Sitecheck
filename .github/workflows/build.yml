
name: Build SiteCheck APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q SiteCheckAndroid-project.zip -d /tmp/sitecheck
          PROJECT_DIR=$(find /tmp/sitecheck -name settings.gradle.kts -printf '%h\n' | head -n 1)
          cp -a "$PROJECT_DIR"/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SiteCheck-APK
          path: app/build/outputs/apk/debug/app-debug.apk
